[build]
  base = "beauty_book-main/beauty_book-main"
  command = "npm install --include=dev && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Proxy Shopify Storefront (équivalent de la réécriture Vercel)
[[redirects]]
  from = "/shopify-graphql"
  to = "https://hwqnwb-hi.myshopify.com/api/2024-10/graphql.json"
  status = 200
  force = true

# Application monopage (React Router) : toutes les routes renvoient index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self), payment=(self)"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
