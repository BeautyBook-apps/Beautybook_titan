[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_ANON_KE"

[[redirects]]
  from = "/api/voice-key"
  to = "/.netlify/functions/voice-key"
  status = 200

[[redirects]]
  from = "/api/xai-token"
  to = "/.netlify/functions/xai-token"
  status = 200

[[redirects]]
  from = "/api/content/styles/engagement-stats"
  to = "/.netlify/functions/engagement-stats"
  status = 200

[[redirects]]
  from = "/api/shopify-products"
  to = "/.netlify/functions/shopify-products"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
